name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FTP secret shape
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python - <<'PY'
          import os
          def shape(name):
              value = os.environ.get(name, "")
              print(f"{name}: length={len(value)} stripped={len(value.strip())} has_newline={chr(10) in value or chr(13) in value}")
          shape("FTP_SERVER")
          shape("FTP_USERNAME")
          shape("FTP_PASSWORD")
          shape("FTP_PORT")
          port = os.environ.get("FTP_PORT", "").strip()
          print(f"FTP_PORT: digits_only={port.isdigit()}")
          PY

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          state-name: cebu-church-deploy-v1
          log-level: minimal
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
            **/.vscode/**
            **/._*
            _backup_transfer_*/
            **/_backup_transfer_*/
            _BUILDER_INPUT/**
            build/**
            build-notice/**
            data/**
            cache/**
            session/**
            tmp/**
            *.log
            .env
            .env.*
