name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          state-name: cebu-church-deploy-v1
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/.vscode/**
            **/._*
            _backup_transfer_*/
            **/_backup_transfer_*/
            _BUILDER_INPUT/**
            build/**
            build-notice/**
            data/**
            cache/**
            session/**
            tmp/**
            *.log
            .env
            .env.*

      - name: Remove uploaded git metadata
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP, error_perm

          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], int(os.environ["FTP_PORT"]), timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])

          try:
              ftp.cwd("/public_html/.git")
          except error_perm as exc:
              print(f"nothing to remove: {exc}")
          else:
              def remove_here():
                  lines = []
                  ftp.retrlines("LIST", lines.append)
                  for line in lines:
                      parts = line.split(maxsplit=8)
                      if len(parts) < 9:
                          continue
                      name = parts[8]
                      if name in (".", ".."):
                          continue
                      if line.startswith("d"):
                          ftp.cwd(name)
                          remove_here()
                          ftp.cwd("..")
                          ftp.rmd(name)
                          print(f"removed dir: {name}")
                      else:
                          ftp.delete(name)
                          print(f"deleted file: {name}")

              remove_here()
              ftp.cwd("/public_html")
              ftp.rmd(".git")
              print("removed /public_html/.git")

          ftp.quit()
          PY
