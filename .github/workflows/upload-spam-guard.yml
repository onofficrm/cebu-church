name: Upload spam guard

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload changed files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python - << 'PY'
          import os
          from ftplib import FTP
          from pathlib import Path

          files = {
              "extend/spam_guard.extend.php": "/public_html/extend/spam_guard.extend.php",
              "bbs/write_comment_update.php": "/public_html/bbs/write_comment_update.php",
          }
          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], int(os.environ["FTP_PORT"]), timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          for local, remote in files.items():
              with Path(local).open("rb") as handle:
                  ftp.storbinary(f"STOR {remote}", handle)
              print(f"uploaded {remote}")
          ftp.quit()
          PY
