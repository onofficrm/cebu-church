name: Remove recent spam

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview lists the posts, delete removes them
        required: true
        default: preview
        type: choice
        options:
          - preview
          - delete

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create one-time token
        id: tok
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "name=_nc_$(openssl rand -hex 8).php" >> "$GITHUB_OUTPUT"

      - name: Upload cleanup script
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          TOKEN: ${{ steps.tok.outputs.token }}
          REMOTE_NAME: ${{ steps.tok.outputs.name }}
        run: |
          python - << 'PY'
          import os
          from ftplib import FTP
          from pathlib import Path

          token = os.environ["TOKEN"]
          remote_name = os.environ["REMOTE_NAME"]
          source = Path(".github/recent-spam-cleanup.php").read_text(encoding="utf-8")
          if "__TOKEN__" not in source:
              raise SystemExit("token placeholder missing")
          script = source.replace("__TOKEN__", token)
          local = Path(remote_name)
          local.write_text(script, encoding="utf-8")

          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], int(os.environ["FTP_PORT"]), timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.cwd("/public_html")
          with local.open("rb") as handle:
              ftp.storbinary(f"STOR {remote_name}", handle)
          ftp.quit()
          local.unlink()
          print(f"uploaded {remote_name}")
          PY

      - name: Run cleanup
        env:
          TOKEN: ${{ steps.tok.outputs.token }}
          REMOTE_NAME: ${{ steps.tok.outputs.name }}
          MODE: ${{ inputs.mode }}
        run: |
          curl --fail --show-error --silent --max-time 180 \
            "https://www.cebu-church.com/${REMOTE_NAME}?k=${TOKEN}&op=${MODE}"

      - name: Remove cleanup script
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          REMOTE_NAME: ${{ steps.tok.outputs.name }}
        run: |
          python - << 'PY'
          import os
          from ftplib import FTP, error_perm

          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], int(os.environ["FTP_PORT"]), timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.cwd("/public_html")
          try:
              ftp.delete(os.environ["REMOTE_NAME"])
              print("removed remote script")
          except error_perm as exc:
              print(f"remove skipped: {exc}")
          ftp.quit()
          PY
